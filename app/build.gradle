plugins { id 'com.android.application' }
android {
    namespace 'com.breadcrumb.ffproxy'
    compileSdk 34
    defaultConfig {
        applicationId "com.breadcrumb.ffproxy"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "4.0-Offsets"
        externalNativeBuild { cmake { cppFlags "-std=c++17 -O2"; abiFilters 'arm64-v8a' } }
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
